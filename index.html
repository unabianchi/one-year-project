<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Year One</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }

  body {
    background: #fff;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    cursor: none;
  }

  #canvas {
    position: fixed;
    inset: 0;
    display: block;
  }

  #logo {
    position: fixed;
    bottom: 0;
    left: 0;
    z-index: 300;
    pointer-events: none;
    user-select: none;
  }

  #logo img {
    display: block;
    width: 100vw;
    height: auto;
  }

  @media (min-width: 1200px) {
    #logo img {
      width: 800px;
      height: auto;
    }
  }

  #cursor {
    position: fixed;
    width: 8px;
    height: 8px;
    background: #000;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.7s cubic-bezier(0.34, 1.56, 0.64, 1),
                height 0.7s cubic-bezier(0.34, 1.56, 0.64, 1),
                background-color 0.3s ease;
    mix-blend-mode: difference;
  }

  #cursor.hovering {
    width: 40px;
    height: 40px;
    mix-blend-mode: normal;
    opacity: 1;
  }

  #island {
    position: fixed;
    inset: 0;
    z-index: 201;
    display: none;
    align-items: flex-start;
    justify-content: center;
    /* background set dynamically to the asset's hover colour */
  }
  #island.open { display: flex; }

  #island-inner {
    width: 840px;
    max-width: 100vw;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
    /* no background — overlay colour shows around it */
  }
  #island-inner::-webkit-scrollbar { display: none; }

  #island-header {
    position: sticky;
    top: 0;
    z-index: 10;
    /* background set dynamically via JS to match island colour */
    padding: 32px 20px 20px;
    font-family: Arial, -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 0.8px;
    color: #000;
  }

  #island-grid {
    display: flex;
    gap: 20px;
    padding: 0 20px 40px;
    align-items: flex-start;
  }

  .island-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .island-cell {
    opacity: 0;
    overflow: hidden;
    background: rgba(255,255,255,0.15);
    will-change: opacity;
  }

  .island-cell img,
  .island-cell video {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Native cursors inside island: zoom-out everywhere, pointer on video cells */
  #island.open * { cursor: zoom-out !important; }
  #island.open .island-cell[data-type="video"],
  #island.open .island-cell[data-type="video"] * { cursor: pointer !important; }

  @keyframes cellIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  #island-grid.cascade .island-cell {
    animation: cellIn .3s ease var(--cell-delay, 0ms) both;
  }

</style>
</head>
<body>

<div id="cursor"></div>
<canvas id="canvas"></canvas>
<div id="logo">
  <img src="assets/logo.svg" alt="Year One" />
</div>
<div id="island">
  <div id="island-inner">
    <div id="island-header"></div>
    <div id="island-grid"></div>
  </div>
</div>

// ─── Layout constants ─────────────────────────────────────────────────────────
const BASE_ASSET_W  = 167;           // original asset pixel width in definitions
const COL_WIDTH     = 220;           // rendered column width (assets scale up to fill)
const ASSET_H_SCALE = COL_WIDTH / BASE_ASSET_W; // height scale factor ≈ 1.317
const COL_GAP       = 20;
const COL_STRIDE    = COL_WIDTH + COL_GAP; // 240px
const ROW_GAP       = 20;
const COL_V_OFFSET  = -COL_STRIDE;
const BASE_COLS     = 12;

const TILE_W = BASE_COLS * COL_STRIDE;

// ─── Distribute assets across columns (greedy: shortest column first) ─────────
// Each asset appears in exactly one column; the whole grid is the repeating tile.
const colAssignments = Array.from({length: BASE_COLS}, () => []);
const colHeights     = new Array(BASE_COLS).fill(0);
const assetCol       = new Int32Array(IMAGES_DEF.length); // reverse lookup: asset → column
IMAGES_DEF.forEach((def, i) => {
  let minCol = 0;
  for (let c = 1; c < BASE_COLS; c++) if (colHeights[c] < colHeights[minCol]) minCol = c;
  colAssignments[minCol].push(i);
  colHeights[minCol] += Math.round(def.h * ASSET_H_SCALE) + ROW_GAP;
  assetCol[i] = minCol;
});

// ─── Media state ─────────────────────────────────────────────────────────────
// bitmaps[i]  – pre-scaled ImageBitmap at display size (null until loaded)
// videoEls[i] – HTMLVideoElement, created only on first hover (null otherwise)
// imgColors[i]– sampled centre colour for cursor tint
const bitmaps   = new Array(IMAGES_DEF.length).fill(null);
const videoEls  = new Array(IMAGES_DEF.length).fill(null);
const imgColors = IMAGES_DEF.map(() => '#808080');

// ─── Lazy, concurrency-limited image loader ───────────────────────────────────
// Key insight: iPhone photos are ~12 MP. Drawing them downscaled to 167 px every
// frame is extremely expensive. createImageBitmap pre-scales once to display size
// so each draw() is a trivial blit. It also releases the full-res decoded buffer,
// cutting per-image GPU memory from ~46 MB to ~0.1 MB.
const MAX_CONCURRENT = 6;
let   activeLoads    = 0;
const loadQueue      = [];
// 0 = unqueued · 1 = queued/in-flight · 2 = done
const loadState      = new Uint8Array(IMAGES_DEF.length);

const offCanvas = document.createElement('canvas');
const offCtx    = offCanvas.getContext('2d', { willReadFrequently: true });

function sampleColor(bitmap, def) {
  try {
    offCanvas.width = def.w; offCanvas.height = def.h;
    offCtx.drawImage(bitmap, 0, 0, def.w, def.h);
    const d = offCtx.getImageData(0, 0, def.w, def.h).data;
    let bestChroma = -1, bestR = 128, bestG = 128, bestB = 128;
    // Score by chroma (max − min): rewards both saturation AND brightness.
    // A dark navy has high saturation but low chroma; a bright red has both.
    // min > 120: skip max channel — keeps only bright vivid pixels.
    for (let j = 0; j < d.length; j += 12) {
      const r = d[j], g = d[j+1], b = d[j+2];
      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      if (max < 120 || min > 210) continue; // reject dark + near-white
      const chroma = max - min;
      if (chroma > bestChroma) { bestChroma = chroma; bestR = r; bestG = g; bestB = b; }
    }
    return `rgb(${bestR},${bestG},${bestB})`;
  } catch(_) { return '#808080'; }
}

function _doLoad(i) {
  activeLoads++;
  const def = IMAGES_DEF[i];

  function buildBitmap(source, srcW, srcH) {
    const dpr = window.devicePixelRatio || 1;
    const correctH = Math.round(srcH * def.w / srcW);
    if (correctH !== def.h) {
      colHeights[assetCol[i]] += Math.round(correctH * ASSET_H_SCALE) - Math.round(def.h * ASSET_H_SCALE);
      def.h = correctH;
    }
    const oc = document.createElement('canvas');
    oc.width  = Math.round(COL_WIDTH * dpr);
    oc.height = Math.round(correctH * ASSET_H_SCALE * dpr);
    const ox  = oc.getContext('2d');
    ox.imageSmoothingEnabled = true;
    ox.imageSmoothingQuality = 'high';
    ox.drawImage(source, 0, 0, oc.width, oc.height);
    createImageBitmap(oc).then(bm => {
      bitmaps[i]   = bm;
      imgColors[i] = sampleColor(bm, def);
    }).catch(() => {
      bitmaps[i] = source;
    }).finally(done);
  }

  if (def.type === 'video') {
    // Seek to the first frame of the actual video — native resolution, no upscaling artefacts.
    const v = document.createElement('video');
    v.muted       = true;
    v.playsInline = true;
    v.preload     = 'metadata';
    v.addEventListener('seeked', () => {
      buildBitmap(v, v.videoWidth || def.w, v.videoHeight || def.h);
      v.src = ''; // release network resource immediately after capture
    }, { once: true });
    v.addEventListener('loadedmetadata', () => { v.currentTime = 0.001; }, { once: true });
    v.addEventListener('error', done, { once: true });
    v.src = def.src;
  } else {
    const img = new Image();
    img.onload = () => {
      // Trust naturalWidth/naturalHeight — browser applies EXIF rotation
      buildBitmap(img, img.naturalWidth || def.w, img.naturalHeight || def.h);
    };
    img.onerror = done;
    img.src = def.src;
  }

  function done() {
    loadState[i] = 2;
    activeLoads--;
    _drain();
  }
}

function _drain() {
  while (activeLoads < MAX_CONCURRENT && loadQueue.length > 0) {
    _doLoad(loadQueue.shift());
  }
}

function enqueue(i, urgent) {
  if (loadState[i] === 2) return;
  if (loadState[i] === 0) {
    loadState[i] = 1;
    if (urgent) loadQueue.unshift(i); else loadQueue.push(i);
    _drain();
  } else if (urgent) {
    // Already queued but not yet started — move to front
    const idx = loadQueue.indexOf(i);
    if (idx > 0) { loadQueue.splice(idx, 1); loadQueue.unshift(i); }
  }
}

// Pre-queue everything in background so it all loads eventually
for (let i = 0; i < IMAGES_DEF.length; i++) enqueue(i, false);

ASSET_GROUP.forEach((gid, i) => { if (gid >= 0) (GROUP_MEMBERS[gid] ??= []).push(i); });

const island       = document.getElementById('island');
const islandInner  = document.getElementById('island-inner');
const islandHeader = document.getElementById('island-header');
const islandGrid   = document.getElementById('island-grid');

let islandIdx = -1;

// ─── Canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const DPR    = window.devicePixelRatio || 1;

function resize() {
  canvas.width  = Math.round(window.innerWidth  * DPR);
  canvas.height = Math.round(window.innerHeight * DPR);
  canvas.style.width  = window.innerWidth  + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled  = true;
  ctx.imageSmoothingQuality  = 'low';
}
resize();
window.addEventListener('resize', resize);

// ─── Pan state ────────────────────────────────────────────────────────────────
let offX = 0, offY = 0;

const SPEED          =  0.02;
const BASE_DIR_X     = -0.634;
const BASE_DIR_Y     =  0.775;
const STEER_STRENGTH =  0.8;
const DIR_LERP       =  0.006;

let dirX = BASE_DIR_X, dirY = BASE_DIR_Y;
let targetDirX = BASE_DIR_X, targetDirY = BASE_DIR_Y;

// ─── Drag / wheel ─────────────────────────────────────────────────────────────
let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
let isDragging = false;
let dragStartX = 0, dragStartY = 0, dragOffStartX = 0, dragOffStartY = 0;
let clickStartX = 0, clickStartY = 0;

document.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  cursor.style.left = mouseX + 'px';
  cursor.style.top  = mouseY + 'px';

  const nx = (mouseX / window.innerWidth  - 0.5) * 2;
  const ny = (mouseY / window.innerHeight - 0.5) * 2;
  targetDirX = BASE_DIR_X + nx * STEER_STRENGTH;
  targetDirY = BASE_DIR_Y + ny * STEER_STRENGTH;

  if (isDragging && islandIdx < 0) {
    offX = dragOffStartX + (e.clientX - dragStartX);
    offY = dragOffStartY + (e.clientY - dragStartY);
  }
});

document.addEventListener('mousedown', e => {
  isDragging    = true;
  dragStartX    = e.clientX; dragStartY    = e.clientY;
  dragOffStartX = offX;      dragOffStartY = offY;
  clickStartX   = e.clientX; clickStartY   = e.clientY;
});
document.addEventListener('mouseup', e => {
  isDragging = false;
  const dx = e.clientX - clickStartX;
  const dy = e.clientY - clickStartY;
  if (Math.sqrt(dx * dx + dy * dy) < 6) {
    if (island.classList.contains('open')) {
      // Tap anywhere closes island — exception: video cells (handled by their click listener)
      const cell = e.target.closest('.island-cell');
      if (cell && cell.dataset.type === 'video') return;
      closeIsland();
      return;
    }
    const info = getCellInfo(e.clientX, e.clientY);
    if (info) openIsland(info.idx, { x: info.ix, y: info.top, w: COL_WIDTH, h: info.dh });
  }
});

// Island inner: always prevent native scroll (eliminates Safari rubber-band overscroll)
// and manually drive scrollTop so we keep full control of boundaries.
island.addEventListener('wheel', e => {
  e.preventDefault();
  e.stopPropagation();
  islandInner.scrollTop += e.deltaY;
}, { passive: false });

document.addEventListener('wheel', e => {
  if (islandIdx >= 0) {
    e.preventDefault();
    return;
  }
  e.preventDefault();
  offX -= e.deltaX * 0.8;
  offY -= e.deltaY * 0.8;
}, { passive: false });

// ─── Touch panning (mobile / tablet) ─────────────────────────────────────────
let touchStartX = 0, touchStartY = 0, touchLastX = 0, touchLastY = 0;

canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  touchStartX = touchLastX = t.clientX;
  touchStartY = touchLastY = t.clientY;
  clickStartX = t.clientX;
  clickStartY = t.clientY;
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  offX += t.clientX - touchLastX;
  offY += t.clientY - touchLastY;
  touchLastX = t.clientX;
  touchLastY = t.clientY;
}, { passive: false });

canvas.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  if (Math.sqrt(dx * dx + dy * dy) < 10) {
    const info = getCellInfo(t.clientX, t.clientY);
    if (info) openIsland(info.idx, { x: info.ix, y: info.top, w: COL_WIDTH, h: info.dh });
  }
}, { passive: true });

// ─── Video hover state ────────────────────────────────────────────────────────
let activeVideoIdx = -1;   // index of the currently playing video asset
let activeVideoEl  = null;
let videoStopTimer = null;

function startVideo(idx) {
  if (activeVideoEl) stopVideo();
  // Create the video element on first hover — avoids 45 upfront network requests
  if (!videoEls[idx]) {
    const v = document.createElement('video');
    v.src       = IMAGES_DEF[idx].src;
    v.muted     = true;
    v.playsInline = true;
    v.preload   = 'auto';
    videoEls[idx] = v;
  }
  const v = videoEls[idx];
  activeVideoEl  = v;
  activeVideoIdx = idx;
  v.currentTime  = 0;
  v.play().catch(() => {});
  videoStopTimer = setTimeout(stopVideo, 3000);
}

function stopVideo() {
  clearTimeout(videoStopTimer);
  if (activeVideoEl) { activeVideoEl.pause(); activeVideoEl.currentTime = 0; }
  activeVideoEl  = null;
  activeVideoIdx = -1;
}

// ─── Hit detection ────────────────────────────────────────────────────────────
function getCellAt(mx, my) {
  const info = getCellInfo(mx, my);
  return info ? info.idx : -1;
}

function getCellInfo(mx, my) {
  const W  = canvas.width / DPR;
  const ox = ((offX % TILE_W) + TILE_W) % TILE_W;

  const firstCi = Math.floor(-ox / COL_STRIDE) - 1;
  const lastCi  = firstCi + Math.ceil(W / COL_STRIDE) + 3;

  for (let ci = firstCi; ci <= lastCi; ci++) {
    const sx = ci * COL_STRIDE + ox;
    if (sx + COL_WIDTH < mx || sx > mx) continue;

    const colMod   = ((ci % BASE_COLS) + BASE_COLS) % BASE_COLS;
    const assets   = colAssignments[colMod];
    const cth      = colHeights[colMod];
    const colOy    = ((offY % cth) + cth) % cth;
    const colBase  = colMod * COL_V_OFFSET + colOy;
    const k        = Math.floor((my - colBase) / cth);
    const iterBase = colBase + k * cth;

    let iy = iterBase;
    for (const assetIdx of assets) {
      const def = IMAGES_DEF[assetIdx];
      const dh  = Math.round(def.h * ASSET_H_SCALE);
      const top = iy; iy += dh + ROW_GAP;
      if (my < top || my >= top + dh) continue;
      if (mx >= sx && mx < sx + COL_WIDTH) return { idx: assetIdx, ix: sx, top, dh };
    }
  }
  return null;
}

// ─── Draw ─────────────────────────────────────────────────────────────────────
function draw() {
  const W  = canvas.width / DPR;
  const H  = canvas.height / DPR;
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);

  const ox  = ((offX % TILE_W) + TILE_W) % TILE_W;

  const firstCi = Math.floor(-ox / COL_STRIDE) - 1;
  const lastCi  = firstCi + Math.ceil(W / COL_STRIDE) + 3;

  ctx.fillStyle = '#e8e8e8'; // placeholder colour (set once outside the loops)

  for (let ci = firstCi; ci <= lastCi; ci++) {
    const sx = ci * COL_STRIDE + ox;
    if (sx + COL_WIDTH < 0 || sx > W) continue;

    const colMod = ((ci % BASE_COLS) + BASE_COLS) % BASE_COLS;
    const assets = colAssignments[colMod];
    // Each column tiles at its own natural height — no cross-column boundary gap
    const cth    = colHeights[colMod];
    const colOy  = ((offY % cth) + cth) % cth;
    const colBase = colMod * COL_V_OFFSET + colOy;
    const k0      = Math.floor(-colBase / cth) - 1;

    for (let k = k0; ; k++) {
      const iterBase = colBase + k * cth;
      if (iterBase > H + 10) break;

      let iy = iterBase;
      for (const assetIdx of assets) {
        const def = IMAGES_DEF[assetIdx];
        const dh  = Math.round(def.h * ASSET_H_SCALE);
        const top = iy; iy += dh + ROW_GAP;
        if (top + dh < 0 || top > H) continue;

        const bm = bitmaps[assetIdx];

        if (assetIdx === activeVideoIdx && activeVideoEl && activeVideoEl.readyState >= 2) {
          ctx.drawImage(activeVideoEl, sx, top, COL_WIDTH, dh);
        } else if (bm) {
          ctx.drawImage(bm, sx, top, COL_WIDTH, dh);
        } else {
          ctx.fillRect(sx, top, COL_WIDTH, dh); // placeholder while loading
          enqueue(assetIdx, true);              // bump to front of queue
        }
      }
    }
  }
}

// ─── Animation loop ───────────────────────────────────────────────────────────
const cursor   = document.getElementById('cursor');
let lastTime   = null;
let hoveredIdx = -1;

function tick(ts) {
  if (!lastTime) lastTime = ts;
  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;

  // Direction steering
  dirX += (targetDirX - dirX) * DIR_LERP;
  dirY += (targetDirY - dirY) * DIR_LERP;
  const mag = Math.sqrt(dirX * dirX + dirY * dirY);
  const vx  = (dirX / mag) * SPEED;
  const vy  = (dirY / mag) * SPEED;

  if (!isDragging && islandIdx < 0) { offX += vx * dt; offY += vy * dt; }

  draw();

  // Hover detection — suppressed while island is open
  if (islandIdx < 0) {
    const idx = getCellAt(mouseX, mouseY);
    if (idx !== hoveredIdx) {
      if (hoveredIdx >= 0 && IMAGES_DEF[hoveredIdx].type === 'video') stopVideo();
      if (idx >= 0 && IMAGES_DEF[idx].type === 'video') startVideo(idx);
      hoveredIdx = idx;
      cursor.style.background = idx >= 0 ? imgColors[idx] : '#000';
      cursor.classList.toggle('hovering', idx >= 0);
    }
  }

  requestAnimationFrame(tick);
}

requestAnimationFrame(tick);


// ─── Island open / close ──────────────────────────────────────────────────────
let islandVideoEl = null; // currently playing inline video in island

function stopIslandVideo() {
  if (islandVideoEl) { islandVideoEl.pause(); islandVideoEl = null; }
}

function openIsland(idx, clickRect) {
  islandIdx = idx;
  const gid = ASSET_GROUP[idx];
  const def = IMAGES_DEF[idx];

  if (hoveredIdx >= 0 && IMAGES_DEF[hoveredIdx].type === 'video') stopVideo();
  hoveredIdx = -1;
  cursor.classList.remove('hovering');
  cursor.style.background = '#000';
  stopIslandVideo();

  // Background colour = clicked asset's sampled hover colour
  const bgColor = imgColors[idx] || '#888';
  island.style.background   = bgColor;
  islandHeader.style.background = bgColor; // needed for sticky to be opaque

  // Header
  islandHeader.textContent = CLUSTER_LABEL[gid] || '';

  // Build grid — two masonry columns, greedy shortest-column (mirrors canvas layout)
  islandGrid.innerHTML = '';
  const members = gid >= 0 ? [...(GROUP_MEMBERS[gid] || [])] : [idx];
  const clickedPos = members.indexOf(idx);
  if (clickedPos > 0) { members.splice(clickedPos, 1); members.unshift(idx); }
  islandGrid.classList.remove('cascade'); // reset before rebuild

  const colLeft  = document.createElement('div');
  const colRight = document.createElement('div');
  colLeft.className = colRight.className = 'island-col';
  islandGrid.appendChild(colLeft);
  islandGrid.appendChild(colRight);

  const colEls = [colLeft, colRight];
  const colHts = [0, 0]; // proportional height tracker for column balancing

  members.forEach((relIdx, i) => {
    const d = IMAGES_DEF[relIdx];
    const cell = document.createElement('div');
    cell.className = 'island-cell';
    cell.dataset.type = d.type;
    cell.dataset.src  = d.src;
    if (d.type === 'video') cell.dataset.poster = d.poster || '';
    const img = new Image();
    img.src = d.type === 'video' ? (d.poster || d.src) : d.src;
    img.loading = 'eager';
    // Reserve correct height before image loads — eliminates layout-shift jitter
    img.style.aspectRatio = `${d.w}/${d.h}`;
    cell.appendChild(img);
    cell.style.setProperty('--cell-delay', `${i * 50}ms`); // pre-bake stagger

    const col = colHts[0] <= colHts[1] ? 0 : 1;
    colEls[col].appendChild(cell);
    colHts[col] += d.h / d.w; // accumulate aspect-ratio height for next pick
  });

  // ── compute island first-cell target rect ──
  const W        = window.innerWidth;
  const innerW   = Math.min(840, W);
  const cellPad  = 20;
  const cellGap  = 20;
  const cellW    = (innerW - 2 * cellPad - cellGap) / 2;
  // cellH matches the clicked asset's natural aspect ratio (same as it appears on canvas)
  const cellH    = clickRect ? Math.round(cellW * (clickRect.h / clickRect.w)) : cellW;
  const cellLeft = (W - innerW) / 2 + cellPad;
  const cellTop  = 69; // header: 32px top + ~17px text + 20px bottom

  // 1. Open overlay at opacity 0, then fade background in
  island.style.opacity = '0';
  island.classList.add('open');
  islandInner.scrollTop = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    island.style.transition = 'opacity .25s ease';
    island.style.opacity    = '1';
  }));

  if (clickRect) {
    // 2. After background is visible, zoom the asset into the island first cell.
    //    FLIP: place element at final position, apply inverse transform to make it
    //    appear at the canvas source, then transition transform to identity.
    //    All on the compositor thread — no layout per frame.
    setTimeout(() => {
      const sx = clickRect.w / cellW;
      const sy = clickRect.h / cellH;
      const tx = clickRect.x - cellLeft;
      const ty = clickRect.y - cellTop;

      const flyEl = document.createElement('div');
      flyEl.style.cssText = `
        position:fixed; left:${cellLeft}px; top:${cellTop}px;
        width:${cellW}px; height:${cellH}px;
        overflow:hidden; z-index:500; pointer-events:none;
        transform-origin:0 0;
        transform:translate(${tx}px,${ty}px) scale(${sx},${sy});
        will-change:transform;
        transition:transform .38s cubic-bezier(.4,0,.2,1);
      `;
      const flyImg = new Image();
      flyImg.src = def.type === 'video' ? (def.poster || def.src) : def.src;
      flyImg.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
      flyEl.appendChild(flyImg);
      document.body.appendChild(flyEl);

      requestAnimationFrame(() => requestAnimationFrame(() => {
        flyEl.style.transform = 'translate(0,0) scale(1)';
      }));

      // 3. After fly lands: cascade + cross-fade fly out in sync with cell[0] fading in
      setTimeout(() => {
        islandGrid.classList.add('cascade');
        flyEl.style.transition = 'opacity .3s linear';
        flyEl.style.opacity = '0';
        setTimeout(() => flyEl.remove(), 320);
      }, 410);
    }, 280);

  } else {
    // No click rect: cascade after background appears
    setTimeout(() => { islandGrid.classList.add('cascade'); }, 280);
  }
}

// ── Inline video playback for island cells ──
islandGrid.addEventListener('click', e => {
  const cell = e.target.closest('.island-cell');
  if (!cell || cell.dataset.type !== 'video') return;

  const existing = cell.querySelector('video');
  if (existing) {
    existing.paused ? existing.play() : existing.pause();
    return;
  }

  if (islandVideoEl) {
    const prevCell = islandVideoEl.closest('.island-cell');
    islandVideoEl.pause();
    islandVideoEl.remove();
    if (prevCell) {
      const poster = new Image();
      poster.src = prevCell.dataset.poster || prevCell.dataset.src;
      prevCell.appendChild(poster);
    }
    islandVideoEl = null;
  }

  const img = cell.querySelector('img');
  if (img) img.remove();
  const v = document.createElement('video');
  v.src         = cell.dataset.src;
  v.autoplay    = true;
  v.playsInline = true;
  v.loop        = true;
  v.controls    = false;
  cell.appendChild(v);
  islandVideoEl = v;
});

function closeIsland() {
  stopIslandVideo();
  island.style.transition = 'opacity .2s ease';
  island.style.opacity = '0';
  setTimeout(() => {
    island.classList.remove('open');
    island.style.background   = '';
    island.style.opacity      = '';
    island.style.transition   = '';
    islandHeader.style.background = '';
    cursor.style.opacity = ''; // restore custom cursor
    islandIdx = -1;
  }, 220);
}

// Hide custom cursor inside island so native cursor works
island.addEventListener('mouseenter', () => { cursor.style.opacity = '0'; });
island.addEventListener('mouseleave', () => { cursor.style.opacity = ''; });

// Island touch: tap anywhere closes, except on video cells (which get click → play/pause)
let islandTouchStartX = 0, islandTouchStartY = 0;
island.addEventListener('touchstart', e => {
  const t = e.touches[0];
  islandTouchStartX = t.clientX;
  islandTouchStartY = t.clientY;
}, { passive: true });
island.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - islandTouchStartX;
  const dy = t.clientY - islandTouchStartY;
  if (Math.sqrt(dx * dx + dy * dy) < 10) {
    const cell = e.target.closest('.island-cell');
    if (cell && cell.dataset.type === 'video') return;
    closeIsland();
  }
}, { passive: true });

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeIsland(); });
</script>
</body>
</html>
